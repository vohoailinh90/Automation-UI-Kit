# ci-runner-mode: pinned
# Not on the CI_RUNNER switch: demo-build and device-build need macOS, which
# the Linux VPS cannot provide. The Linux core tests are in ios-core.yml,
# which follows it.
name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

concurrency:
  # Same rule as ci.yml: a newer push to a PR cancels that PR's older run;
  # every other run gets its own group and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  demo-build:
    name: Demo app (iOS Simulator)
    # macOS minutes cost ~10x Linux minutes, hence the path filter above and
    # the cancel-on-new-push rule. A build needs no simulator boot.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build IdeaLabDemo (compiles IdeaLabUI for iOS)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project ios/IdeaLabDemo/IdeaLabDemo.xcodeproj \
            -scheme IdeaLabDemo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | grep -E ": (error|warning): |\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

  device-build:
    name: Demo app (iOS device)
    # The simulator build skips what runs only on an iPhone: the code under
    # `#if !targetEnvironment(simulator)`, such as the Vision requests the
    # simulator cannot run. Compiled here, unsigned; nothing runs.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build IdeaLabDemo for an iPhone (compiles the device-only code)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project ios/IdeaLabDemo/IdeaLabDemo.xcodeproj \
            -scheme IdeaLabDemo \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | grep -E ": (error|warning): |\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

  store-tests:
    name: StoreKit tests (iOS Simulator)
    # LabStore against StoreKit's own test environment (StoreKitTest, with
    # ios/IdeaLabKit/Tests/IdeaLabStoreTests/Products.storekit): loading,
    # buying, Ask to Buy, refunds, restoring. Only an Apple platform has it,
    # so the Linux core tests cannot run these.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Test IdeaLabStore on an iPhone simulator
        working-directory: ios/IdeaLabKit
        # Each test has a minute (.timeLimit); a run that still hangs stops here.
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p ../../build
          # One test at a time: every StoreKit test session drives the same
          # test environment.
          xcodebuild test \
            -scheme IdeaLabKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath ../../build/DerivedData \
            -only-testing:IdeaLabStoreTests \
            -parallel-testing-enabled NO \
            2>&1 | tee ../../build/xcodebuild-test.log
