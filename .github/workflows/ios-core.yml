name: iOS core tests

# IdeaLabCore's tests on Linux: the kit's rules (money, doses, cleanup), not its
# SwiftUI, which only builds on macOS (ios.yml). Unlike ios.yml this follows the
# CI_RUNNER switch, so it keeps running on the VPS when the hosted minutes run
# out (docs/ci-runner-mode.md).
#
# The compiler is the official Swift image, pinned, whenever the runner has
# Docker, so the VPS and a hosted runner test with the same one. Otherwise the
# runner's own `swift`, if it can read the package (Swift 6.0+). With neither,
# the job says what to install rather than failing somewhere deep in a build.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-core.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-core.yml"]

concurrency:
  # Same rule as ci.yml: a newer push to a PR cancels that PR's older run;
  # every other run gets its own group and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      SWIFT_IMAGE: swift:6.4-noble
    defaults:
      run:
        working-directory: ios/IdeaLabKit
    steps:
      - uses: actions/checkout@v4

      - name: Test IdeaLabCore
        run: |
          # The build never goes into the checkout, so a persistent runner is
          # left with nothing to clean up.
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            # As the runner's own user, with the checkout read-only: a root
            # container would leave root-owned files in the workspace, which
            # the next checkout on a self-hosted runner cannot delete.
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/package:ro" --workdir /package "$SWIFT_IMAGE" \
              sh -c 'swift --version && swift test --scratch-path /tmp/build'
          elif command -v swift >/dev/null 2>&1 && swift package tools-version >/dev/null 2>&1; then
            swift --version
            swift test --scratch-path "$RUNNER_TEMP/idealab-build"
          else
            echo "::error::This runner has no Swift 6 toolchain, and no Docker to run $SWIFT_IMAGE."
            echo "::error::On the VPS: install Docker and add the runner's user to the docker group, then restart the runner service. Or install Swift 6 from swift.org."
            exit 1
          fi
