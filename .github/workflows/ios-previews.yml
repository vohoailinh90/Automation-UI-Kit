# ci-runner-mode: pinned
# Not on the CI_RUNNER switch: render needs macOS, and publish holds a
# contents:write token, which stays on an ephemeral GitHub-hosted runner.
name: iOS previews

# Screenshots of every demo screen (light, dark, large text) from a real
# simulator. On demand only — about 5 to 15 minutes of macOS time per run:
# - Actions tab → "iOS previews" → Run workflow, or
# - add the `ios-previews` label to a pull request (remove and re-add it to
#   render the PR's latest commit again).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  render:
    # Builds and runs the pull request's own code, so it only ever gets a
    # read-only token, and checkout does not leave that token on disk.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ios-previews'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Render screenshots
        run: ios/scripts/render-previews.sh "$RUNNER_TEMP/previews"

      - name: Shrink for review
        run: sips --resampleWidth 600 "$RUNNER_TEMP"/previews/*.png >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ios-previews
          path: ${{ runner.temp }}/previews
          retention-days: 14

  publish:
    # Also publishes the images as a one-commit orphan branch, so they can be
    # viewed on GitHub (and fetched with git) without downloading a zip.
    # Nothing from the pull request runs here: this job only moves the PNGs
    # the render job uploaded. Skipped for forks, whose token is read-only.
    needs: render
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-previews
          path: previews

      - name: Push to the ios-previews branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd previews
          printf 'Screenshots of the iOS demo app at %s.\nOverwritten on every run of the "iOS previews" workflow.\n' "$SOURCE_SHA" > README.md
          git init -q -b ios-previews
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "iOS previews for $SOURCE_SHA"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-previews
