# XcodeGen spec for the demo app. The generated IdeaLabDemo.xcodeproj is
# committed so the project opens with a double-click; after editing this file,
# regenerate it with `xcodegen generate` (run in this folder) and commit both.
name: IdeaLabDemo
options:
  bundleIdPrefix: dev.idealab
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: vi
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  IdeaLabKit:
    path: ../IdeaLabKit
targets:
  IdeaLabDemo:
    type: application
    platform: iOS
    sources:
      - path: IdeaLabDemo
    # Keys the generated Info.plist has no build setting for. Xcode merges the
    # generated ones (INFOPLIST_KEY_*) into this file.
    info:
      path: IdeaLabDemo/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # iOS 26: the app has an AssistiveAccess scene for the mode.
        UISupportsAssistiveAccess: true
        # With limited access, the library screen offers no picker of its
        # own, so iOS should not put one up at each launch either.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
    dependencies:
      - package: IdeaLabKit
        product: IdeaLabCore
      - package: IdeaLabKit
        product: IdeaLabUI
      - package: IdeaLabKit
        product: IdeaLabPhotos
      - package: IdeaLabKit
        product: IdeaLabStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.idealab.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IdeaLab UI
        # The library screen reads and deletes photos (IdeaLabPhotos).
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Để tìm ảnh chụp màn hình và ảnh chụp nhiều lần, rồi xoá những ảnh bạn chọn. Ảnh được phân loại ngay trên máy."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # The demo ships no icon; without this Xcode warns about a missing AppIcon set.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  IdeaLabDemo:
    build:
      targets:
        IdeaLabDemo: all
    run:
      config: Debug
      # Run from Xcode, purchases go to StoreKit's local test environment,
      # with the products the store tests use: no App Store Connect needed.
      storeKitConfiguration: ../IdeaLabKit/Tests/IdeaLabStoreTests/Products.storekit
    archive:
      config: Release
