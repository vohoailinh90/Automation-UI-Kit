# XcodeGen spec for the demo app. The generated IdeaLabDemo.xcodeproj is
# committed so the project opens with a double-click; after editing this file,
# regenerate it with `xcodegen generate` (run in this folder) and commit both.
name: IdeaLabDemo
options:
  bundleIdPrefix: dev.idealab
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: vi
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  IdeaLabKit:
    path: ../IdeaLabKit
targets:
  IdeaLabDemo:
    type: application
    platform: iOS
    sources:
      - path: IdeaLabDemo
    dependencies:
      - package: IdeaLabKit
        product: IdeaLabCore
      - package: IdeaLabKit
        product: IdeaLabUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.idealab.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IdeaLab UI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # The demo ships no icon; without this Xcode warns about a missing AppIcon set.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  IdeaLabDemo:
    build:
      targets:
        IdeaLabDemo: all
    run:
      config: Debug
    archive:
      config: Release
