name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Only runs of the same PR share a group, so a newer push cancels that PR's
  # older run. Every other run (push to main, dispatch) gets its own group from
  # run_id, so it is never cancelled or displaced from the queue.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # `--with-deps` installs Chromium's system libraries through apt, which
      # needs root: fine on a GitHub-hosted image, but it fails outright on the
      # VPS runner (this is how trading-dashboard's smoke job broke there). On
      # the VPS those libraries are installed once by the runner's owner, e.g.
      # `sudo npx playwright install-deps chromium`, not by every job.
      - name: Install Playwright browser
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
